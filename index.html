<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="telegram-web-app" content="yes">
    <title>🎧 Radio Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            overflow-x: hidden;
        }
        
        .player-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 15px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .station-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #4dabf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            line-height: 1.2;
        }
        
        .station-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            margin-top: 4px;
        }
        
        .visualizer {
            height: 60px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            margin: 20px 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 0 10px;
            overflow: hidden;
        }
        
        .bar {
            width: 8px;
            background: linear-gradient(to top, #4dabf7, #4ecdc4);
            border-radius: 4px;
            transition: height 0.1s ease;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        
        .play-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a5a);
            color: white;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.4);
            align-self: center;
        }
        
        .play-button.paused {
            background: linear-gradient(45deg, #4dabf7, #3d98e0);
            transform: scale(0.95);
        }
        
        .play-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
        }
        
        .play-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4dabf7, #4ecdc4);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        .progress-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 5px;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        
        .volume-icon {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .volume-slider {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
        }
        
        .volume-bar {
            height: 100%;
            background: #4dabf7;
            border-radius: 2px;
            width: 70%;
        }
        
        .stations-list {
            margin-top: 30px;
            width: 100%;
        }
        
        .stations-title {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .station-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 12px;
            color: white;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .station-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }
        
        .station-btn.active {
            background: linear-gradient(45deg, #4dabf7, #4ecdc4);
            border: none;
            transform: translateX(0);
        }
        
        .info-panel {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.85);
        }
        
        .info-title {
            color: #4dabf7;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .offline {
            background: #f44336;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 480px) {
            .player-container {
                padding: 20px;
                margin: 10px;
            }
            
            .station-name {
                font-size: 24px;
            }
            
            .play-button {
                width: 70px;
                height: 70px;
                font-size: 35px;
            }
            
            .visualizer {
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="header">
            <h1 class="station-name" id="stationName">Radio Station</h1>
            <div class="station-subtitle" id="stationSubtitle">Нажмите плей для начала прослушивания</div>
        </div>
        
        <div class="visualizer" id="visualizer">
            <div class="bar" style="height: 40%;"></div>
            <div class="bar" style="height: 60%;"></div>
            <div class="bar" style="height: 30%;"></div>
            <div class="bar" style="height: 70%;"></div>
            <div class="bar" style="height: 50%;"></div>
            <div class="bar" style="height: 80%;"></div>
            <div class="bar" style="height: 45%;"></div>
        </div>
        
        <div class="controls">
            <button class="play-button" id="playButton">▶</button>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-dot" id="progressDot"></div>
            </div>
            
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
            
            <div class="volume-control">
                <span class="volume-icon">🔊</span>
                <div class="volume-slider" id="volumeSlider">
                    <div class="volume-bar" id="volumeBar"></div>
                </div>
            </div>
        </div>
        
        <div class="stations-list">
            <h3 class="stations-title">Другие станции</h3>
            <button class="station-btn active" data-station="radio_record">Radio Record</button>
            <button class="station-btn" data-station="relax_fm">Relax FM</button>
            <button class="station-btn" data-station="europa_plus">Europa Plus</button>
            <button class="station-btn" data-station="retro_fm">Ретро FM</button>
        </div>
        
        <div class="info-panel">
            <div class="info-title">
                <span class="status-indicator" id="statusIndicator"></span>
                <span id="connectionStatus">Подключение...</span>
            </div>
            <p>🔊 Аудио воспроизводится в фоновом режиме. Вы можете свернуть Telegram и продолжить слушать.</p>
        </div>
    </div>

    <script>
        // Настройки радиостанций
        const radioStations = {
            'radio_record': {
                url: 'https://radiorecord.hostingradio.ru/rr_main96.aacp',
                name: 'Radio Record',
                genre: 'Dance, Electronic'
            },
            'relax_fm': {
                url: 'http://ic7.101.ru:8000/v12_1',
                name: 'Relax FM',
                genre: 'Relax, Classical'
            },
            'europa_plus': {
                url: 'http://ep256.hostingradio.ru:8052/europaplus256.mp3',
                name: 'Europa Plus',
                genre: 'Pop, Hits'
            },
            'retro_fm': {
                url: 'http://retroserver.streamr.ru:8043/retro256.mp3',
                name: 'Ретро FM',
                genre: 'Retro, 80s-90s'
            }
        };

        // DOM элементы
        const playButton = document.getElementById('playButton');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeBar = document.getElementById('volumeBar');
        const stationButtons = document.querySelectorAll('.station-btn');
        const stationNameEl = document.getElementById('stationName');
        const stationSubtitleEl = document.getElementById('stationSubtitle');
        const statusIndicator = document.getElementById('statusIndicator');
        const connectionStatusEl = document.getElementById('connectionStatus');
        const visualizerBars = document.querySelectorAll('.bar');

        // Аудио элемент
        const audio = new Audio();
        audio.crossOrigin = 'anonymous';
        audio.volume = 0.7;

        // Состояние плеера
        let currentStation = 'radio_record';
        let isPlaying = false;
        let isSeeking = false;

        // Инициализация
        function init() {
            // Получаем параметры из URL
            const urlParams = new URLSearchParams(window.location.search);
            const stationParam = urlParams.get('station');
            
            if (stationParam && radioStations[stationParam]) {
                currentStation = stationParam;
            }
            
            loadStation(currentStation);
            
            // События
            playButton.addEventListener('click', togglePlay);
            progressContainer.addEventListener('click', seek);
            volumeSlider.addEventListener('click', setVolume);
            
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('ended', () => {
                isPlaying = false;
                playButton.textContent = '▶';
                playButton.classList.remove('paused');
            });
            
            audio.addEventListener('loadedmetadata', () => {
                updateDuration();
                setStatus('online', 'Станция готова');
            });
            
            audio.addEventListener('play', () => {
                isPlaying = true;
                playButton.textContent = '⏸';
                playButton.classList.add('paused');
                animateVisualizer();
                setStatus('online', `Слушаем: ${radioStations[currentStation].name}`);
            });
            
            audio.addEventListener('pause', () => {
                isPlaying = false;
                playButton.textContent = '▶';
                playButton.classList.remove('paused');
                stopVisualizer();
                setStatus('online', `Приостановлено: ${radioStations[currentStation].name}`);
            });
            
            audio.addEventListener('error', (e) => {
                console.error('Audio error:', e);
                setStatus('offline', 'Ошибка подключения к станции');
                playButton.disabled = true;
            });
            
            // События для кнопок станций
            stationButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const station = btn.dataset.station;
                    if (station !== currentStation) {
                        loadStation(station);
                        // Автоматически воспроизводим, если уже играет
                        if (isPlaying) {
                            playAudio();
                        }
                    }
                });
            });
            
            // Инициализация громкости
            const initialVolume = audio.volume * 100;
            volumeBar.style.width = `${initialVolume}%`;
            
            // Попытка автовоспроизведения
            attemptAutoPlay();
        }

        // Загрузка станции
        function loadStation(stationKey) {
            currentStation = stationKey;
            const station = radioStations[stationKey];
            
            // Обновляем UI
            stationNameEl.textContent = station.name;
            stationSubtitleEl.textContent = station.genre;
            
            // Обновляем кнопки станций
            stationButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.station === stationKey);
            });
            
            // Загружаем аудио
            audio.src = station.url;
            audio.load();
            
            // Обновляем статус
            setStatus('connecting', 'Подключение к станции...');
            playButton.disabled = true;
        }

        // Воспроизведение/пауза
        function togglePlay() {
            if (isPlaying) {
                audio.pause();
            } else {
                playAudio();
            }
        }

        // Воспроизведение
        function playAudio() {
            if (audio.readyState === 0) {
                audio.load();
            }
            
            audio.play().then(() => {
                playButton.disabled = false;
            }).catch(e => {
                console.error('Playback failed:', e);
                setStatus('offline', 'Требуется разрешение на воспроизведение');
                showPermissionRequired();
            });
        }

        // Попытка автовоспроизведения
        function attemptAutoPlay() {
            const userInteraction = localStorage.getItem('radioPlayer_userInteraction');
            
            if (userInteraction === 'allowed') {
                setTimeout(() => {
                    audio.play().then(() => {
                        console.log('Auto-play successful');
                    }).catch(e => {
                        console.log('Auto-play failed, will wait for user interaction');
                    });
                }, 500);
            }
        }

        // Обновление прогресса
        function updateProgress() {
            const currentTime = audio.currentTime;
            const duration = audio.duration || 1;
            const progressPercent = (currentTime / duration) * 100;
            
            progressBar.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(currentTime);
        }

        // Обновление длительности
        function updateDuration() {
            durationEl.textContent = formatTime(audio.duration);
        }

        // Форматирование времени
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Поиск по прогресс-бару
        function seek(e) {
            const percent = e.offsetX / progressContainer.offsetWidth;
            audio.currentTime = percent * audio.duration;
        }

        // Установка громкости
        function setVolume(e) {
            const percent = e.offsetX / volumeSlider.offsetWidth;
            const volume = Math.min(Math.max(percent, 0), 1);
            audio.volume = volume;
            volumeBar.style.width = `${volume * 100}%`;
        }

        // Установка статуса
        function setStatus(status, message) {
            statusIndicator.className = 'status-indicator';
            statusIndicator.classList.add(status === 'online' ? 'online' : 'offline');
            connectionStatusEl.textContent = message;
        }

        // Анимация визуализатора
        function animateVisualizer() {
            if (!isPlaying) return;
            
            visualizerBars.forEach(bar => {
                const height = Math.random() * 80 + 20;
                bar.style.height = `${height}%`;
            });
            
            requestAnimationFrame(animateVisualizer);
        }

        function stopVisualizer() {
            visualizerBars.forEach(bar => {
                bar.style.height = '0%';
            });
        }

        // Показать сообщение о требуемых разрешениях
        function showPermissionRequired() {
            stationSubtitleEl.textContent = '⚠️ Нажмите на кнопку play для разрешения воспроизведения';
            stationSubtitleEl.style.color = '#ffcc00';
        }

        // Обработка событий Telegram WebView
        function setupTelegramIntegration() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const tg = window.Telegram.WebApp;
                    
                    // Настройка темы в соответствии с Telegram
                    document.body.style.background = tg.backgroundColor;
                    
                    // Обработка открытия/закрытия
                    tg.onEvent('mainButtonClicked', playAudio);
                    
                    // Отправка данных в бота (опционально)
                    function sendDataToBot(action, data) {
                        tg.sendData(JSON.stringify({
                            action: action,
                            data: data,
                            timestamp: new Date().toISOString()
                        }));
                    }
                    
                    // Отправляем событие загрузки
                    setTimeout(() => {
                        sendDataToBot('player_loaded', { station: currentStation });
                    }, 1000);
                }
            } catch (e) {
                console.log('Telegram WebApp not available:', e);
            }
        }

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            init();
            setupTelegramIntegration();
            
            // Сохраняем информацию о пользовательском взаимодействии
            document.addEventListener('click', () => {
                localStorage.setItem('radioPlayer_userInteraction', 'allowed');
            }, { once: true });
        });
    </script>
</body>
</html>
