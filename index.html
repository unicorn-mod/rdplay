<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎧 Radio Player</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .player {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        .station-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .info {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="player">
        <div class="station-name" id="stationName">Radio Station</div>
        <audio id="radioPlayer" controls autoplay>
            <source src="" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <div class="info">Нажмите на плейер для управления воспроизведением</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const station = urlParams.get('station') || 'radio_record';
        const stations = {
            'radio_record': 'https://radiorecord.hostingradio.ru/rr_main96.aacp',
            'relax_fm': 'http://ic7.101.ru:8000/v12_1',
            'europa_plus': 'http://ep256.hostingradio.ru:8052/europaplus256.mp3',
            'retro_fm': 'http://retroserver.streamr.ru:8043/retro256.mp3'
        };
        
        const player = document.getElementById('radioPlayer');
        const stationName = document.getElementById('stationName');
        
        // Устанавливаем название станции
        stationName.textContent = station.replace('_', ' ').replace(/\b\w/g, c => c.toUpperCase());
        
        // Устанавливаем источник аудио
        player.src = stations[station] || stations['radio_record'];
        
        // Автовоспроизведение с обработкой ошибок
        player.addEventListener('loadedmetadata', () => {
            player.play().catch(e => {
                console.log('Autoplay blocked:', e);
            });
        });
    </script>
</body>
</html>
