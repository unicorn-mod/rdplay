<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎧 Radio Player</title>
    <style>
        body { 
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .player {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        .station-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .info {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.9;
        }
        .debug-info {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="player">
        <div class="station-name" id="stationName">Loading...</div>
        <audio id="radioPlayer" controls>
            <source src="" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <div class="info" id="stationInfo">Загрузка станции...</div>
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        // 🔄 ИСПРАВЛЕНО: Правильное получение параметра из URL
        function getParameterByName(name, url = window.location.href) {
            name = name.replace(/[\[\]]/g, '\\$&');
            var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
                results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        // 🔄 ИСПРАВЛЕНО: Полный список станций с короткими ID
        const stations = {
            'record': {
                url: 'https://radiorecord.hostingradio.ru/rr_main96.aacp',
                name: 'Radio Record',
                genre: 'Dance, Electronic'
            },
            'relax': {
                url: 'http://ic7.101.ru:8000/v12_1',
                name: 'Relax FM',
                genre: 'Relax, Classical'
            },
            'europa': {
                url: 'http://ep256.hostingradio.ru:8052/europaplus256.mp3',
                name: 'Europa Plus',
                genre: 'Pop, Hits'
            },
            'retro': {
                url: 'http://retroserver.streamr.ru:8043/retro256.mp3',
                name: 'Ретро FM',
                genre: 'Retro, 80s-90s'
            },
            'nashe': {
                url: 'http://nashe1.hostingradio.ru:80/nashe-128.mp3',
                name: 'Наше Радио',
                genre: 'Rock, Russian Rock'
            },
            'monte': {
                url: 'http://monte.hostingradio.ru:8000/montecarlo256.mp3',
                name: 'Монте-Карло',
                genre: 'Pop, Foreign Hits'
            }
        };

        const player = document.getElementById('radioPlayer');
        const stationName = document.getElementById('stationName');
        const stationInfo = document.getElementById('stationInfo');
        const debugInfo = document.getElementById('debugInfo');

        // 🔄 ИСПРАВЛЕНО: Получаем station_id из URL
        const stationId = getParameterByName('station') || 'record';
        const debugMode = getParameterByName('debug') === 'true';

        if (debugMode) {
            debugInfo.style.display = 'block';
            debugInfo.innerHTML = `<b>Debug Info:</b><br>station_id: ${stationId}<br>location: ${window.location.href}`;
        }

        // 🔄 ИСПРАВЛЕНО: Проверяем существование станции
        const station = stations[stationId] || stations['record'];

        // Устанавливаем название станции
        stationName.textContent = station.name;
        stationInfo.textContent = station.genre;

        // Устанавливаем источник аудио
        player.src = station.url;

        // Автовоспроизведение с обработкой ошибок
        player.addEventListener('loadedmetadata', () => {
            player.play().then(() => {
                console.log(`✅ Воспроизведение начато для станции: ${station.name}`);
            }).catch(e => {
                console.log('🔇 Автовоспроизведение заблокировано:', e);
                stationInfo.textContent = 'Нажмите ▶ для воспроизведения';
            });
        });

        player.addEventListener('error', (e) => {
            console.error('❌ Ошибка аудио:', e);
            stationInfo.textContent = '❌ Ошибка подключения к станции';
        });
    </script>
</body>
</html>
